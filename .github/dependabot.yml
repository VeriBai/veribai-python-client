version: 2
updates:
  # Actions are pinned to SHAs, which means they do not drift, and also that
  # nothing updates them unless something asks. This is that something.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # init and analyze must run the same version, or analyze fails with
      # "Loaded a configuration file for version X, but running version Y".
      codeql:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        patterns: ["*"]
        exclude-patterns: ["requests"]
