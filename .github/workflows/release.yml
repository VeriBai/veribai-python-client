name: release

# Publishing is deliberately NOT automatic on a merge to main. It happens only
# when a `v*` tag is pushed, and then only after a human approves the `pypi`
# environment. Two independent gates, because a release of this package is a
# release of code that files other people's tax records.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - id: check
        name: The tag and pyproject must agree
        run: |
          set -euo pipefail
          version=$(uv run --no-project python -c \
            "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match pyproject version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: full test suite
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    name: build
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The `pypi` environment carries a required reviewer, so this job waits for
    # a human before it can touch PyPI. Configure it in
    # Settings → Environments → pypi → Required reviewers.
    environment:
      name: pypi
      url: https://pypi.org/p/veribai
    permissions:
      id-token: write       # OIDC for PyPI Trusted Publishing — no API token exists
      attestations: write   # build provenance, so a published artifact is traceable
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            --verify-tag
