name: release

# The version in pyproject.toml is the SINGLE source of truth. Bump it, merge to main,
# and this workflow tags that commit and publishes it. There is no tag to push by hand:
# the tag is an output of a release, not an input to one.
#
# Every other push to main is a no-op here: `v<version>` already exists, so there is
# nothing to release. That check is what makes "merging publishes" safe to say: what
# triggers a release is the deliberate act of changing the version, not the merge.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: has this version been released?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(uv run --no-project python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "::notice::v${version} is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v${version} has never been released, releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: full test suite
    needs: check
    if: needs.check.outputs.release == 'true'
    # The same suite the PR ran, not a copy of it that can drift.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    name: build
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    # Configure Settings → Environments → pypi → Required reviewers to make this job
    # wait for a human. That control needs a public repository, or a private one on a
    # paid plan; on a free private repo the environment exists but gates nothing.
    environment:
      name: pypi
      url: https://pypi.org/p/veribai
    permissions:
      id-token: write       # OIDC for PyPI Trusted Publishing, no API token exists
      attestations: write   # build provenance, so a published artifact is traceable
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  tag:
    name: tag + GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      # Deliberately last. A tag is the record of a release that happened, so an
      # aborted or rejected publish leaves no tag claiming otherwise, and a re-run
      # is then just a re-run rather than a cleanup job.
      - name: Tag the released commit and cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "Ver [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
